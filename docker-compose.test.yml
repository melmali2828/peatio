services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"

  influxdb:
    image: influxdb:1.7.8
    environment:
      INFLUXDB_ADMIN_ENABLED: "true"
    ports:
      - "8086:8086"

  rabbitmq:
    image: rabbitmq:3.8.9
    ports:
      - "5672:5672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
